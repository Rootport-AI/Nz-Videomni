[project]
name = "ltx-desktop-backend"
version = "1.0.0"
description = "LTX-2 Video Generation Backend"
requires-python = ">=3.12"
# 2026-07-28 cleanup (PENDING_TASKS.md §3-25): removed sageattention, triton
# (both platform variants), imageio + imageio-ffmpeg, peft, fastapi/uvicorn/
# python-multipart (engine-venv copies), pynvml, ftfy -- all fork-era (4ea5c4b)
# leftovers with zero importers in this codebase (consumer code was already
# deleted in d0d3df5). sentencepiece and protobuf are deliberately KEPT
# (Gemma tokenizer fallback concern, owner decision). See
# engine/venv-engine.freeze.txt for the matching freeze-side removal + the
# transitive orphan analysis.
#
# 2026-07-31 (Acceleration feature, D4/STEP 5): triton-windows is RE-ADDED
# below -- it now has a real importer, engine/transformer/
# sage_attention_service.py (via sageattention's own runtime JIT use of
# triton), unlike its fork-era dead-weight predecessor. Its version is left
# unbound here, same convention as every other engine-venv dependency in this
# list: the exact pin (triton-windows==3.5.1.post24) lives in
# engine/venv-engine.freeze.txt, which is what the DEFAULT (freeze) install
# path actually applies.
#
# sageattention itself is DELIBERATELY NOT listed here, in dependencies OR in
# [tool.uv.sources] below, even though it is also re-added project-wide. The
# only supported source for it is the direct wheel URL pinned in
# scripts/install_ltx.ps1's $engineDirectPins (see also
# engine/venv-engine.freeze.txt), because that wheel is ABI-pinned to this
# project's exact validated stack (cu128 / torch 2.9.1) and ships no PyPI
# build uv could resolve here anyway. A venv resolved from THIS file deliberately
# does NOT get sage: such a resolve yields an UNVALIDATED newer torch (~2.11),
# which the pinned wheel is not built against and would silently fail to import
# (or, worse, import against a mismatched ABI) -- so a hand-resolved venv is
# sage-unavailable by design, not by oversight, and falls back to sdpa.
#
# NOTHING READS THIS FILE AUTOMATICALLY. scripts/install_ltx.ps1 applies the
# freeze (engine/venv-engine.freeze.txt) and only the freeze; the -ResolveLatest
# flag that used to consume this file was deleted on 2026-09-02 because it had
# never worked (Docs/PENDING_TASKS_CLOSED.md 3-104). The file is kept as the
# dependency SPEC for the next torch update, to be applied BY HAND:
#   1. copy this file into an empty scratch directory, renamed `pyproject.toml`
#      (uv reads only that exact name -- which is why the old flag always failed,
#      it pointed uv at engine/ where no such name exists),
#   2. uv pip install --python <repo>\.venv-engine\Scripts\python.exe
#          --index-strategy unsafe-best-match <that scratch directory>
#   3. validate the resulting stack, then regenerate
#      engine/venv-engine.freeze.txt (its own header documents the method).
dependencies = [
    "pillow>=10.3.0",
    "torch>=2.3.0",
    "huggingface-hub>=0.23.0",
    "tqdm>=4.66.0",
    "pydantic>=2.7.0",
    # LTX-2 inference dependencies
    "ltx-core",
    "ltx-pipelines",
    "diffusers>=0.36.0",
    "protobuf>=3.20.0",
    "transformers>=4.52,<5",
    "sentencepiece>=0.1.99",
    "opencv-python-headless>=4.8.0",
    "gguf>=0.10.0",
    "triton-windows",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchaudio = { index = "pytorch-cu128" }
diffusers = { git = "https://github.com/huggingface/diffusers.git", rev = "01de02e8b4f2cc91df4f3e91cb6535ebcbeb490c" }
ltx-core = { git = "https://github.com/Lightricks/LTX-2.git", subdirectory = "packages/ltx-core", rev = "00dc53d3f81c405932f9f16d9c57557de411e702" }
ltx-pipelines = { git = "https://github.com/Lightricks/LTX-2.git", subdirectory = "packages/ltx-pipelines", rev = "00dc53d3f81c405932f9f16d9c57557de411e702" }

[project.optional-dependencies]
test = ["pytest>=8.0", "requests>=2.31", "httpx>=0.27"]
dev = ["pyright>=1.1.380", "debugpy>=1.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
