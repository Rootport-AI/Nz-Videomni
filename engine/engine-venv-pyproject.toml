[project]
name = "ltx-desktop-backend"
version = "1.0.0"
description = "LTX-2 Video Generation Backend"
requires-python = ">=3.12"
# sentencepiece and protobuf are deliberately KEPT (Gemma tokenizer fallback
# concern, owner decision; VERIFICATION_LOG section 40.1).
#
# triton-windows has real importers: engine/gguf/dequant_triton_kernels.py (the
# fused GGUF dequantisation kernels) and sageattention's own runtime JIT (used
# by engine/transformer/sage_attention_service.py). Its version is left
# unbound here, same convention as every other engine-venv dependency in this
# list: the exact pin lives in engine/venv-engine.freeze.txt, which is what
# scripts/install_ltx.ps1 applies.
#
# sageattention itself is DELIBERATELY NOT listed here, in dependencies OR in
# [tool.uv.sources] below, even though the engine venv does install it. The
# only supported source for it is the direct wheel URL pinned in
# scripts/install_ltx.ps1's $engineDirectPins (see also
# engine/venv-engine.freeze.txt), because that wheel is ABI-pinned to this
# project's exact validated stack (cu128 / torch 2.9.1) and ships no PyPI
# build uv could resolve here anyway. A venv resolved from THIS file deliberately
# does NOT get sage: such a resolve yields an UNVALIDATED newer torch,
# which the pinned wheel is not built against and would silently fail to import
# (or, worse, import against a mismatched ABI) -- so a hand-resolved venv is
# sage-unavailable by design, not by oversight, and falls back to sdpa.
#
# NOTHING READS THIS FILE AUTOMATICALLY. scripts/install_ltx.ps1 applies the
# freeze (engine/venv-engine.freeze.txt) plus the direct pins in
# $engineDirectPins, never this file. The file is kept as the dependency SPEC
# for the next torch update, to be applied BY HAND:
#   1. copy this file into an empty scratch directory, renamed `pyproject.toml`
#      (uv reads only that exact name),
#   2. uv pip install --python <repo>\.venv-engine\Scripts\python.exe
#          --index-strategy unsafe-best-match <that scratch directory>
#   3. validate the resulting stack, then regenerate
#      engine/venv-engine.freeze.txt (its own header documents the method).
dependencies = [
    "pillow>=10.3.0",
    "torch>=2.3.0",
    "huggingface-hub>=0.23.0",
    "tqdm>=4.66.0",
    "pydantic>=2.7.0",
    # LTX-2 inference dependencies
    "ltx-core",
    "ltx-pipelines",
    "diffusers>=0.36.0",
    "protobuf>=3.20.0",
    "transformers>=4.52,<5",
    "sentencepiece>=0.1.99",
    "opencv-python-headless>=4.8.0",
    "gguf>=0.10.0",
    "triton-windows",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchaudio = { index = "pytorch-cu128" }
diffusers = { git = "https://github.com/huggingface/diffusers.git", rev = "01de02e8b4f2cc91df4f3e91cb6535ebcbeb490c" }
ltx-core = { git = "https://github.com/Lightricks/LTX-2.git", subdirectory = "packages/ltx-core", rev = "00dc53d3f81c405932f9f16d9c57557de411e702" }
ltx-pipelines = { git = "https://github.com/Lightricks/LTX-2.git", subdirectory = "packages/ltx-pipelines", rev = "00dc53d3f81c405932f9f16d9c57557de411e702" }

[project.optional-dependencies]
test = ["pytest>=8.0", "requests>=2.31", "httpx>=0.27"]
dev = ["pyright>=1.1.380", "debugpy>=1.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
