[project]
name = "ltx25-engine"
version = "1.0.0"
description = "LTX-2.5 Video Generation Engine (separate venv from the 2.3 engine)"
requires-python = ">=3.12"
# ---------------------------------------------------------------------------
# WHY A SECOND ENGINE VENV AT ALL
#
# This file is the LTX 2.5 sibling of engine/engine-venv-pyproject.toml. The two
# stacks CANNOT share one interpreter: official LTX-2 v1.2.0 requires
# transformers 5.x (Gemma 4), while the 2.3 engine is pinned to transformers
# 4.57.6 -- one venv cannot hold both. So .venv-engine (2.3) and
# .venv-engine-ltx25 (2.5) are built side by side and never touch each other.
#
# HOW THIS RESOLVES -- READ BEFORE EDITING (the "M2 correction")
#
# The 2.3 file expresses its pinned torch via `[[tool.uv.index]] cu128` +
# `[tool.uv.sources] torch/torchaudio = { index = "pytorch-cu128" }`. That
# pattern was TRIED here first and does NOT work for this dependency set: the
# official LTX-2 git packages carry their own uv index configuration (cu132),
# and the two collide during resolution. The verified recipe is instead:
#
#   * declare ltx-core / ltx-pipelines as PEP 508 DIRECT URLs right in
#     `dependencies` below (no [tool.uv.sources] table in this file at all), and
#   * install with  --no-sources
#                   --index https://download.pytorch.org/whl/cu128
#                   --index-strategy unsafe-best-match
#
# `--no-sources` is what keeps the dependency-side uv tables out of the picture;
# the explicit cu128 `--index` (plus unsafe-best-match, same known uv torchaudio
# bug as the 2.3 stack) is what supplies the CUDA builds.
#
# BOTH torch AND torchaudio must carry the exact `+cu128` local version below.
# Leaving torchaudio unpinned was measured to drag in torchaudio 2.11, which
# then pulls a matching torch and silently defeats the 2.9.1 pin.
#
# scripts/install_ltx.ps1 (Ensure-EngineVenv) applies all of this for real
# users; the resolved result is frozen in engine25/venv-engine-ltx25.freeze.txt,
# which is the DEFAULT deterministic install path. This file is only consulted
# by the opt-in -ResolveLatest route.
#
# sageattention IS installed in this venv (2026-08-25, Acceleration third wave:
# `attention_backend: "sage"` is a per-job option on the 2.5 engine now) but is
# DELIBERATELY NOT LISTED in `dependencies` below -- exactly the same discipline
# engine/engine-venv-pyproject.toml keeps for the 2.3 stack. The only supported
# source is the direct wheel URL pinned in scripts/install_ltx.ps1's
# $ltx25DirectPins (recorded as a bare line in
# engine25/venv-engine-ltx25.freeze.txt), because that wheel is ABI-pinned to
# this project's exact validated stack (cp310-abi3 / cu128 / torch 2.9.1) and
# ships no PyPI build uv could resolve here anyway. Listing it here would put it
# in the path of -ResolveLatest, which resolves an UNVALIDATED newer torch the
# pinned wheel is not built against -- so a -ResolveLatest venv is
# sage-unavailable BY DESIGN and falls back to sdpa, on both engines alike.
#
# DELIBERATELY ABSENT (do not add without a plan change):
#   diffusers      -- 2.3-only dependency; the 2.5 pipeline does not use it.
#   natten         -- only the diffusion-decoder VAE wants it; v1 uses Conv VAE.
# triton-windows was on that list until 2026-08-24 ("nothing imports it here").
# It is a real dependency now: the 2.5 engine fuses its GGUF K-quant
# dequantisation on Triton too (engine/gguf/dequant_triton.py is shared with the
# 2.3 engine and sits on the 2.5 transformer AND text-encoder paths), so the
# wheel has an importer here exactly as it does in .venv-engine.
# openimageio is NOT listed either, but for the opposite reason: it is a hard
# transitive requirement of `ltx_pipelines.distilled` and a real Windows wheel
# exists (3.1.16.0, cp312, win_amd64), so it arrives on its own.
# ---------------------------------------------------------------------------
dependencies = [
    "torch==2.9.1+cu128",
    "torchaudio==2.9.1+cu128",
    # Official LTX-2 v1.2.0 == d151147788a9284cca791edc6ce898007e727fe6.
    # Pinned by full SHA, not the v1.2.0 tag, so the resolution cannot move.
    "ltx-core @ git+https://github.com/Lightricks/LTX-2.git@d151147788a9284cca791edc6ce898007e727fe6#subdirectory=packages/ltx-core",
    "ltx-pipelines @ git+https://github.com/Lightricks/LTX-2.git@d151147788a9284cca791edc6ce898007e727fe6#subdirectory=packages/ltx-pipelines",
    # Gemma 4 support landed in transformers 5.8. The upper bound is the
    # validated ceiling (5.14.1 is what this stack resolved and was frozen at).
    "transformers>=5.8,<5.15",
    # GGUF reader for the Q4 transformer + Q4/Q6 text encoder.
    "gguf>=0.10.0",
    # The 4 non-quantized weights (VAEs + spatial upscaler) stay safetensors.
    "safetensors>=0.7.0",
    # engine/preprocess: cv2 does every canny/dwpose/depth frame operation, and
    # torchvision is imported in exactly one place (the VDA depth wrapper's
    # Compose). Added 2026-08-24 so the 2.5 engine builds IC-LoRA control videos
    # with the same code the 2.3 engine runs; cv2 4.13.0.92 is ABI-compatible
    # with this stack's numpy 2.5.2 (verified). torchvision carries the exact
    # `+cu128` local version for the same reason torch/torchaudio do above --
    # an unpinned torchvision drags a matching newer torch in behind it.
    "opencv-python-headless>=4.8.0",
    "torchvision==0.24.1+cu128",
    # Runtime JIT for the fused GGUF dequantisation kernels
    # (engine/gguf/dequant_triton_kernels.py). Version left unbound here, the
    # same convention this file uses for every non-torch dependency: the exact
    # pin (triton-windows==3.5.1.post24, identical to the 2.3 venv's) lives in
    # engine25/venv-engine-ltx25.freeze.txt, which is the DEFAULT install path.
    # The wheel bundles its own TinyCC/ptxas, so no Visual Studio is needed.
    "triton-windows",
]
