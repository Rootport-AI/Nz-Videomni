[project]
name = "ltx-aviutl2-bridge"
version = "0.4.0"
description = "LTX 2.3 video generation backend (FastAPI + Gradio) for 16GB VRAM. Phase 1: T2V + minimal I2V."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

# FastAPI side dependencies ONLY (the app venv .venv).
# torch / ltx-pipelines are intentionally NOT listed here.
# The engine stacks (LTX 2.3 and LTX 2.5) are installed separately into their
# own venvs by scripts/install_ltx.ps1 (see README) and run as worker
# processes started by the engine adapters under services/engines/.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "gradio>=6.19,<7",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "pillow>=10.2",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "mcp>=1.28,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
# Keep everything project-local. Never install into the system Python.
package = false
